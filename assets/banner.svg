<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#0b0f19;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="bgGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#070a10"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cyanGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".2"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".85"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".85"/></linearGradient><linearGradient id="lineGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/><stop offset="50%" stop-color="#818cf8" stop-opacity=".7"/><stop offset="100%" stop-color="#c084fc" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulseAnimation{0%{transform:scale(.95);opacity:.3}}@keyframes floatOne{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-16px) translateX(10px)}}@keyframes floatTwo{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(14px) translateX(-8px)}}@keyframes floatThree{0%{transform:translateY(0)}50%{transform:translateY(-20px)}}@keyframes floatPill{0%{transform:translateY(0)}}.bg-grid{stroke:rgba(255,255,255,.04);stroke-width:1}.pulse-circle{animation:pulseAnimation 6s ease-in-out infinite alternate}.float-bubble-1{animation:floatOne 10s ease-in-out infinite}.float-bubble-2{animation:floatTwo 8s ease-in-out infinite}.flow-path{stroke-dasharray:8,8;animation:dash 20s linear infinite}.pill-badge{animation:floatPill 5s ease-in-out infinite alternate}</style></defs><rect width="1200" height="360" fill="url(#bgGlow)" rx="12"/><g opacity=".4" style="mix-blend-mode:screen"><circle cx="200" cy="80" r="140" fill="#38bdf8" class="pulse-circle" filter="url(#glow)"/><circle cx="1020" cy="280" r="160" fill="#a855f7" class="pulse-circle" filter="url(#glow)" style="animation-delay:-3s"/><circle cx="600" cy="30" r="100" fill="#6366f1" class="pulse-circle" filter="url(#glow)" style="animation-delay:-1.5s"/></g><g class="bg-grid"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="300" y2="300"/><line x1="150" x2="150" y1="0" y2="360"/><line x1="300" x2="300" y1="0" y2="360"/><line x1="450" x2="450" y1="0" y2="360"/><line x1="600" x2="600" y1="0" y2="360"/><line x1="750" x2="750" y1="0" y2="360"/><line x1="900" x2="900" y1="0" y2="360"/><line x1="1050" x2="1050" y1="0" y2="360"/></g><path fill="none" stroke="url(#lineGrad)" stroke-width="2" d="M 50 300 Q 300 220, 600 280 T 1150 180" class="flow-path"/><path fill="none" stroke="url(#lineGrad)" stroke-width="1.5" d="M 80 80 Q 400 160, 700 80 T 1120 220" class="flow-path" style="animation-direction:reverse;animation-duration:25s"/><g class="float-bubble-1"><g transform="translate(60, 70)"><rect width="170" height="42" fill="#1e293b" stroke="#334155" stroke-width="1.2" opacity=".85" rx="21"/><circle cx="22" cy="21" r="9" fill="#10b981"/><text x="42" y="26" fill="#e2e8f0" font-size="13" font-weight="600">💬 Omnichannel</text></g><g transform="translate(40, 240)"><rect width="190" height="42" fill="#1e293b" stroke="#334155" stroke-width="1.2" opacity=".85" rx="21"/><circ