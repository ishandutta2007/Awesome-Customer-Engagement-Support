<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-grid { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
      
      /* Dynamic Background Floating Elements */
      .pulse-circle {
        animation: pulseAnimation 6s ease-in-out infinite alternate;
      }
      .float-bubble-1 {
        animation: floatOne 10s ease-in-out infinite;
      }
      .float-bubble-2 {
        animation: floatTwo 8s ease-in-out infinite;
      }
      .float-bubble-3 {
        animation: floatThree 12s ease-in-out infinite;
      }
      .flow-path {
        stroke-dasharray: 8, 8;
        animation: dash 20s linear infinite;
      }
      .pill-badge {
        animation: floatPill 5s ease-in-out infinite alternate;
      }

      @keyframes pulseAnimation {
        0% { transform: scale(0.95); opacity: 0.3; }
        100% { transform: scale(1.15); opacity: 0.65; }
      }
      @keyframes floatOne {
        0% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-16px) translateX(10px); }
        100% { transform: translateY(0px) translateX(0px); }
      }
      @keyframes floatTwo {
        0% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(14px) translateX(-8px); }
        100% { transform: translateY(0px) translateX(0px); }
      }
      @keyframes floatThree {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-20px); }
        100% { transform: translateY(0px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -160; }
      }
      @keyframes floatPill {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGlow)" rx="12" />

  <!-- Subtle Animated Ambient Glows (Behind Everything) -->
  <g opacity="0.4" style="mix-blend-mode: screen;">
    <circle class="pulse-circle" cx="200" cy="80" r="140" fill="#38bdf8" filter="url(#glow)" />
    <circle class="pulse-circle" cx="1020" cy="280" r="160" fill="#a855f7" filter="url(#glow)" style="animation-delay: -3s;" />
    <circle class="pulse-circle" cx="600" cy="30" r="100" fill="#6366f1" filter="url(#glow)" style="animation-delay: -1.5s;" />
  </g>

  <!-- Background Grid Lines -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />

    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Connecting Network Curves (Background Depth) -->
  <path class="flow-path" d="M 50 300 Q 300 220, 600 280 T 1150 180" fill="none" stroke="url(#lineGrad)" stroke-width="2" />
  <path class="flow-path" d="M 80 80 Q 400 160, 700 80 T 1120 220" fill="none" stroke="url(#lineGrad)" stroke-width="1.5" style="animation-direction: reverse; animation-duration: 25s;" />

  <!-- Floating Dynamic Support Elements (Sides & Perimeter - Keeping Center Foreground Pure) -->
  <!-- Left Side Badges / Cards -->
  <g class="float-bubble-1">
    <!-- Chat Pill Left -->
    <g transform="translate(60, 70)">
      <rect width="170" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.2" opacity="0.85"/>
      <circle cx="22" cy="21" r="9" fill="#10b981" />
      <text x="42" y="26" fill="#e2e8f0" font-size="13" font-weight="600">💬 Omnichannel</text>
    </g>
    <!-- Ticket Badge Left -->
    <g transform="translate(40, 240)">
      <rect width="190" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.2" opacity="0.85"/>
      <circle cx="22" cy="21" r="9" fill="#38bdf8" />
      <text x="42" y="26" fill="#e2e8f0" font-size="13" font-weight="600">🎫 Ticket Queues</text>
    </g>
  </g>

  <!-- Right Side Badges / Cards -->
  <g class="float-bubble-2">
    <!-- AI Bot Pill Right -->
    <g transform="translate(970, 75)">
      <rect width="170" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.2" opacity="0.85"/>
      <circle cx="22" cy="21" r="9" fill="#a855f7" />
      <text x="42" y="26" fill="#e2e8f0" font-size="13" font-weight="600">🤖 AI Copilots</text>
    </g>
    <!-- SLA Badge Right -->
    <g transform="translate(950, 245)">
      <rect width="190" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.2" opacity="0.85"/>
      <circle cx="22" cy="21" r="9" fill="#f59e0b" />
      <text x="42" y="26" fill="#e2e8f0" font-size="13" font-weight="600">⚡ SLA Routing</text>
    </g>
  </g>

  <!-- FOREGROUND HERO HEADER & TEXT (Crisp, High Contrast, Centered & Unobstructed) -->
  <g text-anchor="middle">
    <!-- Super-category Eyebrow Pill -->
    <g class="pill-badge" transform="translate(600, 52)">
      <rect x="-165" y="0" width="330" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="0" y="19" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.2">🌟 CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="148" fill="url(#primaryGrad)" font-size="44" font-weight="800" letter-spacing="-0.8" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.6))">
      Customer Engagement &amp; Support
    </text>

    <!-- Subtitle Line 1 -->
    <text x="600" y="194" fill="#f8fafc" font-size="18" font-weight="500" letter-spacing="0.2">
      Top SaaS Platforms &amp; Open-Source Self-Hosted Helpdesks
    </text>

    <!-- Subtitle Line 2 (Feature keywords) -->
    <text x="600" y="226" fill="#94a3b8" font-size="14" font-weight="400" letter-spacing="0.5">
      Omnichannel Inboxes • Ticket Management • SLA Automation • AI Support Agents
    </text>

    <!-- Stat/Highlight Badges (Bottom Center) -->
    <g transform="translate(600, 282)">
      <!-- Badge 1: SaaS Leaders -->
      <g transform="translate(-230, 0)">
        <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
        <text x="0" y="5" fill="#bae6fd" font-size="12" font-weight="600">🏢 Tier-1 SaaS Giants</text>
      </g>
      <!-- Badge 2: Open Source -->
      <g transform="translate(0, 0)">
        <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6"/>
        <text x="0" y="5" fill="#c7d2fe" font-size="12" font-weight="600">💻 Self-Hosted &amp; Open Source</text>
      </g>
      <!-- Badge 3: AI-Ready -->
      <g transform="translate(230, 0)">
        <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0f172a" stroke="#c084fc" stroke-width="1" stroke-opacity="0.6"/>
        <text x="0" y="5" fill="#e9d5ff" font-size="12" font-weight="600">🚀 AI &amp; LLM Powered</text>
      </g>
    </g>
  </g>
</svg>
